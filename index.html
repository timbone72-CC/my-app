<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Address Book v1.0</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input, button { padding: 6px; width: 260px; margin-top: 6px; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .contact { max-width: 200px; }
    .delete {
      background: #c00;
      color: white;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>My Live Address Book v1.0</h1>

  <h3>Add / Import Contacts</h3>
  <label>Name: <input id="name" type="text"></label>
  <label>Phone: <input id="phone" type="tel"></label>

  <button onclick="addContact()">Add Contact</button>
  <button onclick="exportVCF()">Export for Android</button>

  <br><br>
  <input type="file" accept=".vcf" onchange="importVCF(this.files[0])">

  <ul id="contacts"></ul>

  <script>
    let contacts = JSON.parse(localStorage.getItem('contacts')) || [];

    function save() {
      localStorage.setItem('contacts', JSON.stringify(contacts));
    }

    function addContact() {
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      if (!name || !phone) return alert('Enter name and phone');
      contacts.push({ name, phone });
      save(); renderContacts();
      nameInput.value = phoneInput.value = '';
    }

    function deleteContact(i) {
      contacts.splice(i, 1);
      save(); renderContacts();
    }

    function renderContacts() {
      contactsList.innerHTML = '';
      contacts.forEach((c, i) => {
        const li = document.createElement('li');
        li.innerHTML =
          `<div class="contact"><strong>${c.name}</strong><br>${c.phone}</div>
           <button class="delete" onclick="deleteContact(${i})">Delete</button>`;
        contactsList.appendChild(li);
      });
    }

    function exportVCF() {
      if (!contacts.length) return alert('No contacts');
      let vcf = '';
      contacts.forEach(c => {
        vcf += `BEGIN:VCARD
VERSION:3.0
FN:${c.name}
TEL:${c.phone}
END:VCARD
`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard' }));
      a.download = 'address-book.vcf';
      a.click();
    }

    function importVCF(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const cards = e.target.result.split('BEGIN:VCARD').slice(1);
        cards.forEach(card => {
          const name = (card.match(/FN:(.*)/) || [])[1];
          const phone = (card.match(/TEL.*:(.*)/) || [])[1];
          if (name && phone) contacts.push({ name, phone });
        });
        save(); renderContacts();
      };
      reader.readAsText(file);
    }

    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const contactsList = document.getElementById('contacts');

    renderContacts();
  </script>
</body>
</html>
