<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Address Book v0.7</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input, button { padding: 5px; width: 260px; margin-top: 5px; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { padding: 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>My Live Address Book v0.7</h1>

  <h3>Add Contact</h3>
  <label>
    Name:
    <input id="name" type="text">
  </label>

  <label>
    Phone:
    <input id="phone" type="tel">
  </label>

  <button onclick="addContact()">Add Contact</button>

  <ul id="contacts"></ul>

  <script>
    let contacts = JSON.parse(localStorage.getItem('contacts')) || [];

    function save() {
      localStorage.setItem('contacts', JSON.stringify(contacts));
    }

    function addContact() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name || !phone) {
        alert('Please enter name and phone');
        return;
      }

      contacts.push({ name, phone });
      save();
      renderContacts();

      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
    }

    function renderContacts() {
      const list = document.getElementById('contacts');
      list.innerHTML = '';

      contacts.forEach(c => {
        const li = document.createElement('li');
        li.innerHTML = '<strong>' + c.name + '</strong><br>' + c.phone;
        list.appendChild(li);
      });
    }

    renderContacts();
  </script>
</body>
</html>
